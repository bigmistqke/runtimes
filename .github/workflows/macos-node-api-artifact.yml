name: macOS/iOS Node-API artifact

# Replaces the old pkg.pr.new-based workflow: that build succeeded in full
# every time (XCFrameworks assembled for both ios-node-api and
# macos-node-api), it was only the final `pkg-pr-new publish` step that
# failed, with a pkg.pr.new-service-side 404 unrelated to this repo. Pushing
# the built packages to an orphan branch instead - proven working for
# Android via android-artifact.yml - sidesteps that external service
# entirely and gives an ordinary `npm install github:...#branch:subdirectory`
# git dependency.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  XCODE_VERSION: "26.2.0"

jobs:
  build:
    name: Build and push artifact
    runs-on: macos-26
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit
      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{env.XCODE_VERSION}}
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
      - name: Install Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3"
      - name: Install Dependencies
        run: |
          npm install
          python3 -m pip install --upgrade pip six
          # Ensure LLVM linker used by -fuse-ld=lld is available
          if ! command -v ld64.lld >/dev/null; then
            brew list lld || brew install lld
          fi
          # Ensure CMake is available without conflicting with pinned Homebrew formula
          if ! command -v cmake >/dev/null; then
            brew list cmake || brew install cmake
          fi
          # Some scripts expect cmake at /usr/local/bin; create a shim if needed
          if [ ! -x /usr/local/bin/cmake ]; then
            sudo mkdir -p /usr/local/bin
            sudo ln -sf "$(command -v cmake)" /usr/local/bin/cmake
          fi
      - name: Cache metadata generator build
        uses: actions/cache@v6
        with:
          path: |
            metadata-generator/dist
            metadata-generator/build
          key: metagen-${{ hashFiles('metadata-generator/**') }}
      - name: Build
        run: ./scripts/build_all_react_native.sh
      - name: Push built packages to orphan branch
        working-directory: packages
        run: |
          BRANCH="macos-node-api-build"
          SHA=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)

          rm -rf /tmp/orphan && mkdir -p /tmp/orphan
          # objc-node-api isn't included - it's already published normally
          # on npm at the exact version macos-node-api/ios-node-api depend
          # on, so npm resolves it from the registry on its own.
          cp -R ios-node-api macos-node-api /tmp/orphan/
          cd /tmp/orphan

          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$BRANCH"
          git add -A
          git commit -q -m "macOS/iOS Node-API packages built from NativeScript/runtimes@$SHA"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin "$BRANCH"
